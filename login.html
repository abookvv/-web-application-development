<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — Экспедитор</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css">
  <style>
    .login-page { min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; }
    .login-panel { width: min(100%, 400px); }
    .login-panel h1 { margin-bottom: 20px; }
    .login-form { display: flex; flex-direction: column; gap: 16px; padding: 24px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field__label { font-size: 13px; font-weight: 600; }
    .field input { width: 100%; height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--white); }
    .field input:hover { border-color: var(--dark); }
    .field input[aria-invalid="true"] { border-color: #9f2d2d; }
    .field__error, .form-error { margin: 0; color: #9f2d2d; font-size: 12px; }
    .field__error:empty, .form-error:empty { display: none; }
    .form-error { min-height: 17px; }
    .login-form .btn { width: 100%; height: 40px; }
  </style>
</head>
<body data-page="login">
  <main class="login-page">
    <section class="login-panel" aria-labelledby="login-title">
      <h1 id="login-title">Вход</h1>
      <form id="login-form" class="card login-form" novalidate>
        <label class="field">
          <span class="field__label">Логин</span>
          <input id="login" name="login" autocomplete="username" aria-describedby="login-field-error">
          <span class="field__error" id="login-field-error"></span>
        </label>
        <label class="field">
          <span class="field__label">Пароль</span>
          <input id="password" name="password" type="password" autocomplete="current-password" aria-describedby="password-field-error">
          <span class="field__error" id="password-field-error"></span>
        </label>
        <p id="login-error" class="form-error" role="alert" aria-live="polite"></p>
        <button class="btn btn--primary" type="submit">Войти</button>
      </form>
    </section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    (function () {
      var ATTEMPTS_KEY = 'exp_login_attempts';
      var MAX_ATTEMPTS = 5;
      var LOCK_TIME = 5 * 60 * 1000;
      var form = document.getElementById('login-form');
      var loginInput = document.getElementById('login');
      var passwordInput = document.getElementById('password');
      var loginFieldError = document.getElementById('login-field-error');
      var passwordFieldError = document.getElementById('password-field-error');
      var formError = document.getElementById('login-error');

      function readAttempts() {
        try { return JSON.parse(localStorage.getItem(ATTEMPTS_KEY)) || {}; }
        catch (e) { return {}; }
      }

      function writeAttempts(value) {
        try { localStorage.setItem(ATTEMPTS_KEY, JSON.stringify(value)); }
        catch (e) { }
      }

      function clearErrors() {
        loginFieldError.textContent = '';
        passwordFieldError.textContent = '';
        formError.textContent = '';
        loginInput.removeAttribute('aria-invalid');
        passwordInput.removeAttribute('aria-invalid');
      }

      function fieldError(input, element, message) {
        input.setAttribute('aria-invalid', 'true');
        element.textContent = message;
      }

      function minutesLeft(until) {
        return Math.max(1, Math.ceil((until - Date.now()) / 60000));
      }

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        clearErrors();

        var login = loginInput.value.trim();
        var password = passwordInput.value;
        var hasEmptyFields = false;

        if (!login) {
          fieldError(loginInput, loginFieldError, 'Введите логин');
          hasEmptyFields = true;
        }
        if (!password) {
          fieldError(passwordInput, passwordFieldError, 'Введите пароль');
          hasEmptyFields = true;
        }
        if (hasEmptyFields) return;

        var attempts = readAttempts();
        var current = attempts[login] || { count: 0, lockedUntil: 0 };

        if (current.lockedUntil > Date.now()) {
          formError.textContent = 'Слишком много попыток. Повторите через ' + minutesLeft(current.lockedUntil) + ' мин.';
          return;
        }

        if (current.lockedUntil) {
          current = { count: 0, lockedUntil: 0 };
          delete attempts[login];
          writeAttempts(attempts);
        }

        var user = Exp.findUser(login);
        if (!user || user.password !== password) {
          current.count += 1;
          if (current.count >= MAX_ATTEMPTS) {
            current.lockedUntil = Date.now() + LOCK_TIME;
            formError.textContent = 'Слишком много попыток. Вход заблокирован на 5 минут.';
          } else {
            formError.textContent = 'Неверный логин или пароль';
          }
          attempts[login] = current;
          writeAttempts(attempts);
          passwordInput.value = '';
          passwordInput.focus();
          return;
        }

        if (!user.active) {
          formError.textContent = 'Учётная запись отключена. Обратитесь к администратору';
          return;
        }

        delete attempts[login];
        writeAttempts(attempts);
        Exp.startSession(login);
      });

      [loginInput, passwordInput].forEach(function (input) {
        input.addEventListener('input', function () {
          input.removeAttribute('aria-invalid');
          if (input === loginInput) loginFieldError.textContent = '';
          if (input === passwordInput) passwordFieldError.textContent = '';
          formError.textContent = '';
        });
      });
    })();
  </script>
</body>
</html>
